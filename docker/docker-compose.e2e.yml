services:
  tests:
    environment:
      # Mount paths, so they belong to the container. The per-run inputs (driver, case) and the API
      # key travel with `exec -e` instead — see docker/e2e.sh.
      PAIRETO_CLAUDE_CONFIG: "/paireto-secrets/claude.json"
      PAIRETO_CLAUDE_CREDENTIALS: "/paireto-secrets/claude-credentials.json"
      PAIRETO_KIRO_AUTH: "/paireto-secrets/kiro-auth.json"
    volumes:
      - ./.secrets:/paireto-secrets:ro
      - ${HOME}/.codex:/root/.codex:ro
      - ${HOME}/.local/share/opencode:/root/.local/share/opencode:ro
      - ${HOME}/.config/opencode:/root/.config/opencode:ro
