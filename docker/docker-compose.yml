services:
  tests:
    build:
      context: .
      dockerfile: Dockerfile
    image: paireto-tests
    working_dir: /workspace
    # Keep the container alive so we can exec test commands into it repeatedly.
    command: ["sleep", "infinity"]
    # Reap the zombies a long-lived container accumulates (Electron/tmux children).
    init: true
    # Chromium/Electron crashes on Docker's default 64MB /dev/shm.
    shm_size: "2gb"
    # `up --wait` blocks until the entrypoint has finished install + display setup.
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/paireto-ready"]
      interval: "2s"
      timeout: "3s"
      retries: 150
      start_period: "2s"
    environment:
      # Gates the --no-sandbox launch arg in both test runners (Electron won't run as root without it).
      PAIRETO_DOCKER: "1"
    volumes:
      # Live source, edited on the host and run in the container.
      - ..:/workspace
      # Container-local Linux install + VS Code download (host macOS versions can't be reused).
      - paireto-node-modules:/workspace/node_modules
      - paireto-vscode-test:/workspace/.vscode-test

volumes:
  paireto-node-modules:
  paireto-vscode-test:
