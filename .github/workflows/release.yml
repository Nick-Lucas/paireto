name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        type: choice
        options: [patch, minor, major]
        default: minor

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  bump:
    name: Bump version and tag
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      # - name: Require a green CI run on this commit
      #   env:
      #     GH_TOKEN: ${{ github.token }}
      #   run: |
      #     passed=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$GITHUB_SHA" --status success --json databaseId --jq length)
      #     if [ "$passed" = "0" ]; then
      #       echo "::error::CI has not passed on $GITHUB_SHA. Wait for CI to go green on main, then run the release again."
      #       exit 1
      #     fi
      - id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
      - uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - id: version
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          tag=$(npm version "$BUMP" -m "chore(release): %s")
          git push --atomic origin "HEAD:refs/heads/main" "refs/tags/$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  publish:
    name: Publish to the Marketplace
    needs: bump
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: Release
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.bump.outputs.tag }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run package
      - uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
      - name: Show the Marketplace identity ID
        run: az rest --method get --url https://app.vssps.visualstudio.com/_apis/profile/profiles/me --resource 499b84ac-1321-427f-aa17-267ca6975798 --query id --output tsv
      - run: pnpm exec vsce publish --azure-credential --packagePath dist/paireto.vsix --skip-duplicate
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.bump.outputs.tag }}
        run: gh release create "$TAG" dist/paireto.vsix --verify-tag --generate-notes --title "$TAG"
